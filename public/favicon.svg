<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="spaceBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141C2E"/>
      <stop offset="65%" stop-color="#090E17"/>
      <stop offset="100%" stop-color="#04060A"/>
    </radialGradient>

    <!-- Lunar Crescent Gradient -->
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <!-- Martian Glow Gradient -->
    <radialGradient id="marsGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FDBA74"/>
      <stop offset="45%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#9A3412"/>
    </radialGradient>

    <!-- Gold Relic Beacon Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="60%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="relicGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Cosmos Background Disc -->
  <circle cx="32" cy="32" r="30" fill="url(#spaceBg)" stroke="#273549" stroke-width="1.5"/>

  <!-- Orbital Trajectory Arc (Connecting Earth, Moon & Mars) -->
  <path d="M 10 38 C 16 16, 46 14, 54 30" fill="none" stroke="#60A5FA" stroke-width="1.25" stroke-dasharray="2.5 3.5" opacity="0.6"/>

  <!-- Outer Orbital Ring -->
  <ellipse cx="32" cy="32" rx="23" ry="11" transform="rotate(-25 32 32)" fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="3 3" opacity="0.45"/>

  <!-- The Moon: Sleek Archival Crescent -->
  <path d="M 27 15 A 14 14 0 0 0 39 37 A 15.5 15.5 0 1 1 27 15 Z" fill="url(#moonGrad)"/>

  <!-- Mars: Red Planet Sphere in Lower Right -->
  <circle cx="43" cy="41" r="7.5" fill="url(#marsGrad)" stroke="#C2410C" stroke-width="0.75"/>
  <ellipse cx="43" cy="41" rx="7.2" ry="2.2" fill="none" stroke="#FED7AA" stroke-width="0.5" opacity="0.4"/>

  <!-- Golden 4-Point Space Relic Star / Beacon -->
  <g filter="url(#relicGlow)">
    <!-- Star Points -->
    <path d="M 22 20 Q 22 26 16 26 Q 22 26 22 32 Q 22 26 28 26 Q 22 26 22 20 Z" fill="url(#goldGrad)"/>
    <!-- Center Core -->
    <circle cx="22" cy="26" r="1.5" fill="#FFFFFF"/>
  </g>

  <!-- Distant Stars -->
  <circle cx="16" cy="18" r="0.75" fill="#93C5FD" opacity="0.8"/>
  <circle cx="48" cy="19" r="0.85" fill="#E2E8F0" opacity="0.85"/>
  <circle cx="18" cy="44" r="0.6" fill="#FDE68A" opacity="0.7"/>
</svg>
